name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e compilação
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk OBD-Facil.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Facil
          path: OBD-Facil.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OBD Fácil v1.0.${{ github.run_number }}
          body: "Baixe o arquivo **OBD-Facil.apk** abaixo pelo celular e instale."
          files: OBD-Facil.apk

      # Guarda o resultado da compilação no branch "ci-logs" (útil para corrigir erros)
      - name: Salvar log
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "sem log" > /tmp/logs/build.log
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} $(git rev-parse --short HEAD)" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
