name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chave de assinatura fixa. Criada uma única vez pelo próprio CI e protegida pela
      # senha do segredo SIGNING_PASSWORD (Settings > Secrets and variables > Actions).
      - name: Chave de assinatura fixa
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta o segredo SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ ! -f app/obdfacil.keystore ]; then
            keytool -genkeypair -keystore app/obdfacil.keystore -storetype PKCS12 -alias obdfacil \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OBD Facil, C=BR" \
              -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD"
            git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
            git add app/obdfacil.keystore
            git commit -m "Chave de assinatura fixa [skip ci]"
            git push
          fi

      - name: Testes e compilação
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee build.log
          java -version 2>&1 | tee -a build.log
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee -a build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk OBD-Facil.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Facil
          path: OBD-Facil.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: OBD Fácil v1.5.${{ github.run_number }}
          body: "Baixe o arquivo **OBD-Facil.apk** abaixo pelo celular e instale por cima da versão anterior."
          files: OBD-Facil.apk

      # Guarda o resultado da compilação no branch "ci-logs" (útil para corrigir erros)
      - name: Salvar log
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "sem log" > /tmp/logs/build.log
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} $(git rev-parse --short HEAD)" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
